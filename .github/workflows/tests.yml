name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - run: python -m innovation_agent demo --project work/ci-demo
      - run: |
          python -m innovation_agent task demo --agent opportunity --output-dir work/ci-opportunity
          python -m innovation_agent task demo --agent concept --output-dir work/ci-concept
          python -m innovation_agent task demo --agent validation --output-dir work/ci-validation
